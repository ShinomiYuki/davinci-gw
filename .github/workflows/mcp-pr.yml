name: MCP PR 验证

on:
  pull_request:
  # 外部贡献者的 PR 需要维护者批准才能跑起自动检查；
  # 留一个手动入口，任何时候都能在任意分支上直接验证同一套流程。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    env:
      # 测试名与断言信息是中文：子进程必须用 UTF-8 输出，
      # 否则 conda 捕获后再用 cp1252 打印会直接 UnicodeEncodeError 崩掉。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 准备 Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: davinci-gw-ci
          python-version: "3.12"
          auto-activate-base: false

      - name: 安装开发依赖
        shell: pwsh
        run: conda run --no-capture-output -n davinci-gw-ci python -m pip install -e ".[dev]"

      - name: 代码和完整回归
        shell: pwsh
        run: |
          conda run --no-capture-output -n davinci-gw-ci python -m compileall -q src tests
          conda run --no-capture-output -n davinci-gw-ci python -m pytest -q

      - name: 构建 MCP onedir 候选包
        shell: pwsh
        run: |
          $python = (conda run -n davinci-gw-ci python -c "import sys; print(sys.executable)" | Select-Object -Last 1).Trim()
          $version = (conda run -n davinci-gw-ci python -c "from davinci_gw.mcp.version import MCP_VERSION; print(MCP_VERSION)" | Select-Object -Last 1).Trim()
          ./scripts/build_mcp_release.ps1 -Python $python -Version $version
          "MCP_VERSION=$version" >> $env:GITHUB_ENV

      - name: MCP STDIO 与无系统 Python 冒烟
        shell: pwsh
        run: |
          $python = (conda run -n davinci-gw-ci python -c "import sys; print(sys.executable)" | Select-Object -Last 1).Trim()
          $env:DAVINCI_GW_MCP_EXE = "$PWD\dist\mcp\davinci-gw-mcp\davinci-gw-mcp.exe"
          & $python -m pytest -q tests/integration/test_mcp_executable.py

      - name: 上传候选包
        uses: actions/upload-artifact@v4
        with:
          name: davinci-gw-mcp-${{ env.MCP_VERSION }}-win-x64
          path: release/davinci-gw-mcp-${{ env.MCP_VERSION }}-win-x64.zip
          if-no-files-found: error
