# 本文件用于声明 davinci-gw 工程的构建方式、基础元数据和 Python 版本要求。

[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "davinci-gw"
version = "0.2.0"
description = "根据标准化网关路由配置表更新 DaVinci 工程 ARXML。"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1,<4",
  "lxml>=5.2,<7",
]

[project.optional-dependencies]
mcp = ["mcp>=2.1,<3"]
dev = [
  "mcp>=2.1,<3",
  "pytest>=8,<10",
  "pyinstaller>=6.15,<7",
]

[project.scripts]
davinci-gw = "davinci_gw.cli:main"
davinci-gw-mcp = "davinci_gw.mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
  "slow: 使用本地真实 Excel 和大型 ARXML 的慢速集成测试",
]
